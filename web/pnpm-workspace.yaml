allowBuilds:
  msw: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
# Security overrides for transitive deps Dependabot flagged but that have no
# direct entry in package.json. Selective ranges rewrite only vulnerable
# instances, leaving other resolutions untouched.
overrides:
  '@babel/core@<7.29.6': '>=7.29.6 <8' # GHSA arbitrary file read via sourceMappingURL
  'js-yaml@<4.2.0': '>=4.2.0 <5' # quadratic-complexity DoS in merge keys
  'postcss@<8.5.10': '>=8.5.10 <9' # DoS via crafted CSS (only the 8.4.31 instance)
