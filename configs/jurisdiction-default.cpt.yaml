# Default CPT config for `civic-slm train-jurisdiction <slug>`.
#
# `train-jurisdiction` clones this file into
# `artifacts/<slug>-pipeline/cpt.yaml`, then overrides `base_model`,
# `data.train_path`, `data.valid_path`, and `output_dir` per slug.
# Everything below stays the same.
#
# Edge-first base: Gemma 4 E4B (effective-4B, MLX 4-bit). The weights are only
# ~4-8GB, but Gemma's ~262k-token vocab makes the training logits tensor
# (batch * seq * vocab) the memory cap — batch 4 / seq 2048 OOMs the GPU even
# on a 128GB Mac. So train ALL layers (LoRA adds only ~160M params) but keep
# batch_size 1 with grad checkpointing ON. First knob to turn down if you OOM
# is max_seq_length, then batch. Verified via CPT smoke on a 128GB M5 Max.
stage: cpt
# Overwritten by the pipeline composer. Placeholder value satisfies schema.
base_model: REPLACE_AT_PIPELINE_TIME
base_model_revision: main
data:
  train_path: data/processed/REPLACE/train.jsonl
  valid_path: data/processed/REPLACE/valid.jsonl
  format: text

lora:
  rank: 32
  alpha: 64
  dropout: 0.05
  target_modules: all-linear

train:
  iters: 200
  batch_size: 1  # Gemma's 262k vocab makes the logits tensor the memory cap
  grad_checkpoint: true
  max_seq_length: 2048
  learning_rate: 1.0e-5
  lr_schedule: cosine
  warmup_steps: 50
  num_layers: -1  # all layers — LoRA adds only ~160M params, quality > cost

logging:
  project: civic-slm
  steps_per_eval: 50
  steps_per_report: 10
  steps_per_save: 50

output_dir: REPLACE_AT_PIPELINE_TIME
