# Dependabot version updates. Grouping keeps the PR count (and the
# "branch is behind main" churn that blocked the last batch) low: one grouped
# PR per ecosystem per week instead of one per package.
#
# Auto-merge for patch/minor is handled by
# .github/workflows/dependabot-auto-merge.yml. Major bumps stay ungrouped so a
# human reviews them (e.g. torch 2.x, setuptools 8x). CI still gates every
# merge, so the global 7-day min-release-age (uv `exclude-newer-span`) is
# enforced before anything auto-merges — a too-new version fails resolution in
# CI and the auto-merge never fires.
version: 2
updates:
  # Python deps (uv / pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Web app (pnpm workspace under web/)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used by our workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
